<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>

    <!-- Background: deep dark navy -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#07070F"/>
      <stop offset="100%" stop-color="#0C0519"/>
    </linearGradient>

    <!-- Mark: cyan → indigo → violet -->
    <linearGradient id="mg" x1="10" y1="50" x2="190" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00F2FE"/>
      <stop offset="50%"  stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Ambient top glow -->
    <radialGradient id="topglow" cx="50%" cy="10%" r="60%" fx="50%" fy="10%">
      <stop offset="0%"   stop-color="#00F2FE" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft glow around the mark -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ── Background ── -->
  <rect width="200" height="200" rx="42" fill="url(#bg)"/>
  <rect width="200" height="200" rx="42" fill="url(#topglow)"/>
  <!-- Hairline cyan border — defines logo on any background -->
  <rect width="200" height="200" rx="42" fill="none"
        stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.20"/>

  <!-- ── B 9 Mark ── -->
  <g stroke="url(#mg)" stroke-linecap="round" fill="none"
     stroke-width="14" filter="url(#glow)">

    <!-- Letter B -->
    <line x1="28" y1="50"  x2="28"  y2="155"/>   <!-- stem         -->
    <line x1="28" y1="50"  x2="64"  y2="50"/>    <!-- top bar      -->
    <line x1="28" y1="100" x2="62"  y2="100"/>   <!-- middle bar   -->
    <line x1="28" y1="155" x2="64"  y2="155"/>   <!-- bottom bar   -->
    <!-- upper bump: semicircle r=25 (top-right → mid-right) -->
    <path d="M 64,50  A 25,25   0 0 1 62,100" stroke-linecap="butt"/>
    <!-- lower bump: slightly larger r=27.5 (mid-right → bottom-right) -->
    <path d="M 62,100 A 27.5,27.5 0 0 1 64,155" stroke-linecap="butt"/>

    <!-- Number 9 -->
    <circle cx="142" cy="80" r="30"/>             <!-- circle       -->
    <line   x1="163" y1="101" x2="163" y2="155"/> <!-- tail         -->

  </g>
</svg>
